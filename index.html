<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수험 선지 O/X 트레이너</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --danger: #dc2626;
            --accent-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --accent-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            transition: background 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--accent-bg); color: var(--text-main); border: 1px solid var(--card-border); }
        .btn-secondary:hover { background: var(--card-border); }

        .tab-menu {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .section { display: none; }
        .section.active { display: block; }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        textarea, select, input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        textarea { height: 90px; resize: vertical; }

        /* 카테고리 태그 */
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            padding: 6px 12px;
            background: var(--accent-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag .del-tag {
            cursor: pointer;
            color: var(--text-sub);
            font-weight: bold;
        }
        .tag .del-tag:hover { color: var(--danger); }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            gap: 12px;
        }

        .item-category {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .item-text {
            font-size: 14px;
            line-height: 1.4;
            flex: 1;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
        }
        .badge.O { background: rgba(22, 163, 74, 0.15); color: var(--success); }
        .badge.X { background: rgba(220, 38, 38, 0.15); color: var(--danger); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 14px;
        }
        .delete-btn:hover { color: var(--danger); }

        .quiz-progress {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 16px;
            text-align: center;
        }

        .quiz-statement {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            padding: 0 10px;
            text-align: center;
        }

        .quiz-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .ox-btn {
            flex: 1;
            max-width: 160px;
            padding: 20px;
            font-size: 24px;
            font-weight: 800;
            border-radius: 14px;
            border: 2px solid var(--card-border);
            cursor: pointer;
            background: var(--bg-color);
            color: var(--text-main);
        }

        .ox-btn.btn-o:hover { border-color: var(--success); color: var(--success); background: rgba(22, 163, 74, 0.05); }
        .ox-btn.btn-x:hover { border-color: var(--danger); color: var(--danger); background: rgba(220, 38, 38, 0.05); }

        .quiz-result-msg {
            font-size: 18px;
            font-weight: 700;
            margin-top: 20px;
            min-height: 30px;
            text-align: center;
        }

        .empty-notice {
            text-align: center;
            color: var(--text-sub);
            padding: 40px 0;
            font-size: 14px;
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <header>
            <h1>✍️ 수험 선지 O/X 트레이너</h1>
            <div>
                <button type="button" class="btn btn-secondary" onclick="toggleTheme()">🌓 다크/라이트</button>
            </div>
        </header>

        <div class="tab-menu">
            <button type="button" class="tab-btn active" id="tab-input" onclick="switchTab('input')">1. 선지 및 카테고리 관리</button>
            <button type="button" class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">2. O/X 풀기 (<span id="quiz-count">0</span>)</button>
        </div>

        <!-- 선지 및 카테고리 등록 섹션 -->
        <div class="section active card" id="section-input">
            <!-- 카테고리 관리 박스 -->
            <div style="margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px dashed var(--card-border);">
                <h2 style="font-size:15px; margin-bottom:12px;">📁 카테고리 관리</h2>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="new-category-input" placeholder="새 카테고리명 (예: 세법, 재무회계)">
                    <button type="button" class="btn btn-primary" style="white-space:nowrap;" onclick="addCategory()">카테고리 추가</button>
                </div>
                <div class="category-tags" id="category-tags-list"></div>
            </div>

            <h2 style="font-size:15px; margin-bottom:16px;">✏️ 공부한 선지 추가하기</h2>
            <div class="input-group">
                <label>카테고리 선택</label>
                <select id="input-category"></select>
            </div>
            <div class="input-group">
                <label>선지 내용 (변형 없이 그대로 입력)</label>
                <textarea id="input-text" placeholder="예: 자본잠식 상태인 법인의 채무면제이익은 이월결손금 보전에 충당할 수 있다."></textarea>
            </div>
            <div class="input-group">
                <label>정답 여부</label>
                <select id="input-answer">
                    <option value="O">O (참 / 올바른 지문)</option>
                    <option value="X">X (거짓 / 틀린 지문)</option>
                </select>
            </div>
            <button type="button" class="btn btn-primary" style="width:100%; padding:14px;" onclick="addStatement()">선지 추가하기</button>

            <div style="margin-top:30px;">
                <h3 style="font-size:14px; color:var(--text-sub); margin-bottom:10px;">등록된 선지 목록</h3>
                <div class="item-list" id="statement-list"></div>
            </div>
        </div>

        <!-- O/X 풀기 섹션 -->
        <div class="section card" id="section-quiz">
            <div class="input-group" style="margin-bottom: 20px;">
                <label>풀어볼 카테고리 선택</label>
                <select id="quiz-category-select" onchange="initQuiz()">
                    <option value="ALL">전체 카테고리 문제 풀기</option>
                </select>
            </div>

            <div id="quiz-active-area">
                <div class="quiz-progress" id="quiz-progress">문제 1 / 5</div>
                <div class="quiz-statement" id="quiz-statement">등록된 선지가 없습니다. 선지를 먼저 추가해주세요.</div>
                <div class="quiz-buttons" id="quiz-action-btns">
                    <button type="button" class="ox-btn btn-o" onclick="answerQuiz('O')">O</button>
                    <button type="button" class="ox-btn btn-x" onclick="answerQuiz('X')">X</button>
                </div>
                <div class="quiz-result-msg" id="quiz-result-msg"></div>
            </div>
            <div id="quiz-end-area" style="display:none; text-align:center; padding: 30px 0;">
                <h2 style="font-size:22px; margin-bottom:10px;">🎉 모든 문제를 풀었습니다!</h2>
                <p id="quiz-score-summary" style="color:var(--text-sub); margin-bottom:20px;"></p>
                <button type="button" class="btn btn-primary" onclick="restartQuiz()">처음부터 다시 풀기</button>
            </div>
        </div>
    </div>

    <script>
        let categories = JSON.parse(localStorage.getItem('cpa_categories') || '["기본"]');
        let statements = JSON.parse(localStorage.getItem('cpa_ox_items') || '[]');
        let currentQuizIndex = 0;
        let correctCount = 0;
        let shuffledList = [];

        // 탭 전환 함수
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'input') {
                document.getElementById('section-input').classList.add('active');
                document.getElementById('tab-input').classList.add('active');
                renderList();
            } else {
                document.getElementById('section-quiz').classList.add('active');
                document.getElementById('tab-quiz').classList.add('active');
                initQuiz();
            }
        }

        // 카테고리 추가
        function addCategory() {
            const input = document.getElementById('new-category-input');
            const catName = input.value.trim();
            if (!catName) return alert('카테고리 이름을 입력해주세요.');
            if (categories.includes(catName)) return alert('이미 존재하는 카테고리입니다.');

            categories.push(catName);
            localStorage.setItem('cpa_categories', JSON.stringify(categories));
            input.value = '';
            renderCategories();
        }

        // 카테고리 삭제
        function deleteCategory(catName) {
            if (categories.length <= 1) return alert('최소 하나의 카테고리는 존재해야 합니다.');
            if (!confirm(`'${catName}' 카테고리를 삭제하시겠습니까? (속한 선지는 '기본'으로 이동됩니다)`)) return;

            categories = categories.filter(c => c !== catName);
            statements.forEach(item => {
                if (item.category === catName) item.category = '기본';
            });

            localStorage.setItem('cpa_categories', JSON.stringify(categories));
            localStorage.setItem('cpa_ox_items', JSON.stringify(statements));
            renderCategories();
            renderList();
        }

        // 카테고리 UI 렌더링
        function renderCategories() {
            const tagsEl = document.getElementById('category-tags-list');
            tagsEl.innerHTML = categories.map(c => `
                <span class="tag">
                    ${c}
                    <span class="del-tag" onclick="deleteCategory('${c}')">×</span>
                </span>
            `).join('');

            const inputSel = document.getElementById('input-category');
            inputSel.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');

            const quizSel = document.getElementById('quiz-category-select');
            const currentVal = quizSel.value;
            quizSel.innerHTML = `<option value="ALL">전체 카테고리 문제 풀기</option>` + 
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
            if (currentVal) quizSel.value = currentVal;
        }

        // 선지 추가
        function addStatement() {
            const category = document.getElementById('input-category').value || '기본';
            const text = document.getElementById('input-text').value.trim();
            const answer = document.getElementById('input-answer').value;

            if (!text) {
                alert('선지 내용을 입력해주세요.');
                return;
            }

            statements.push({ id: Date.now(), category: category, text: text, answer: answer });
            localStorage.setItem('cpa_ox_items', JSON.stringify(statements));

            document.getElementById('input-text').value = '';
            renderList();
            updateCount();
            alert('선지가 등록되었습니다!');
        }

        // 선지 삭제
        function deleteStatement(id) {
            statements = statements.filter(item => item.id !== id);
            localStorage.setItem('cpa_ox_items', JSON.stringify(statements));
            renderList();
            updateCount();
        }

        // 목록 렌더링
        function renderList() {
            const listEl = document.getElementById('statement-list');
            if (statements.length === 0) {
                listEl.innerHTML = `<div class="empty-notice">등록된 선지가 없습니다.</div>`;
                return;
            }

            listEl.innerHTML = statements.map(item => `
                <div class="item-row">
                    <span class="item-category">${item.category || '기본'}</span>
                    <div class="item-text">${item.text}</div>
                    <span class="badge ${item.answer}">${item.answer}</span>
                    <button type="button" class="delete-btn" onclick="deleteStatement(${item.id})">삭제</button>
                </div>
            `).join('');
        }

        function updateCount() {
            document.getElementById('quiz-count').innerText = statements.length;
        }

        // 퀴즈 초기화
        function initQuiz() {
            updateCount();
            const selectedCat = document.getElementById('quiz-category-select').value;
            
            let targetList = statements;
            if (selectedCat !== 'ALL') {
                targetList = statements.filter(item => item.category === selectedCat);
            }

            if (targetList.length === 0) {
                document.getElementById('quiz-active-area').style.display = 'none';
                document.getElementById('quiz-end-area').style.display = 'block';
                document.getElementById('quiz-score-summary').innerText = '해당 카테고리에 등록된 선지가 없습니다.';
                return;
            }

            document.getElementById('quiz-active-area').style.display = 'block';
            document.getElementById('quiz-end-area').style.display = 'none';

            shuffledList = [...targetList].sort(() => Math.random() - 0.5);
            currentQuizIndex = 0;
            correctCount = 0;
            loadQuizCard();
        }

        function loadQuizCard() {
            if (currentQuizIndex >= shuffledList.length) {
                document.getElementById('quiz-active-area').style.display = 'none';
                document.getElementById('quiz-end-area').style.display = 'block';
                document.getElementById('quiz-score-summary').innerText = `총 ${shuffledList.length}문제 중 ${correctCount}문제 정답 (${Math.round((correctCount/shuffledList.length)*100)}점)`;
                return;
            }

            const current = shuffledList[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `[${current.category || '기본'}] 문제 ${currentQuizIndex + 1} / ${shuffledList.length}`;
            document.getElementById('quiz-statement').innerText = current.text;
            document.getElementById('quiz-result-msg').innerText = '';
            document.getElementById('quiz-action-btns').style.display = 'flex';
        }

        // 정답 체크
        function answerQuiz(selected) {
            const current = shuffledList[currentQuizIndex];
            const msgEl = document.getElementById('quiz-result-msg');
            document.getElementById('quiz-action-btns').style.display = 'none';

            if (selected === current.answer) {
                correctCount++;
                msgEl.innerHTML = `<span style="color:var(--success)">⭕ 정답입니다!</span>`;
            } else {
                msgEl.innerHTML = `<span style="color:var(--danger)">❌ 틀렸습니다! (정답: ${current.answer})</span>`;
            }

            currentQuizIndex++;
            setTimeout(loadQuizCard, 1200);
        }

        function restartQuiz() {
            initQuiz();
        }

        // 테마 토글 (화이트 <-> 다크)
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        window.onload = function() {
            renderCategories();
            renderList();
            updateCount();
        };
    </script>
</body>
</html>
